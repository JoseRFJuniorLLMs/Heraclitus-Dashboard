name: Dashboard R10 red-team qualification

on:
  push:
    branches:
      - gpt56/agent-security-redteam-ui
    paths:
      - .github/redteam-r10-trigger

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt56/agent-security-redteam-ui
          fetch-depth: 0
      - name: Apply R10
        run: python3 scripts/apply_redteam_r10.py
      - name: JavaScript syntax
        run: |
          for f in js/*.js js/components/*.js; do node --check "$f"; done
      - name: Contract tests
        run: node tests/contracts.cjs
      - name: Server tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Python syntax
        run: python3 -m py_compile server.py
      - name: Commit R10
        run: |
          set -euxo pipefail
          rm -f .github/redteam-r10-trigger
          rm -f .github/workflows/redteam-r10.yml
          git config user.name 'GPT-5.6 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(r10): show red-team attacks and HRKL evidence'
          git push origin HEAD:gpt56/agent-security-redteam-ui
